# Sanity09 now targets receiver09; requires its updated firmware (no ID01 fallback).
# Sanity09/09, Sanity15/15, Sanity24/24; native Zenoh, ROS2 /tf input.
# User confirmed Motive bodies aligned and authorized this closer hover experiment.
# Home/hover centres captured from stationary /tf on 2026-10-26 (see setup evidence).
# Independent bounded world-XY acceleration compensation in each MPC worker.
# Concurrent takeoff, then hover vertically at these homes; no row or lateral transfer is required.
# Opt-in stationary_hover uses circular buffers, not full-speed braking reservations.
# Existing speed/region/proximity/freshness/lease checks and group landing remain.
# 15/24 use the inherited Sanity09 calibration/model; not individually identified physics.
# If the aircraft are relocated by >0.10m, recapture homes before flight.
version: 1
transport:
  listen: udp/10.0.0.200:7447
  telemetry_listen: tcp/10.0.0.200:7448
mocap:
  topic: /tf
  parent_frame: map
  world_from_map_xyzw:
  - 0.0
  - 0.0
  - 0.0
  - 1.0
mission:
  kind: hover
  height_m: 1.0
  hover_s: 20.0
  length_m: 1.0
  speed_m_s: 0.3
  cycles: 2
  endpoint_hold_s: 1.0
safety:
  body_radius_m: 0.15
  tracking_margin_m: 0.15
  timing_uncertainty_s: 0.15
  max_speed_m_s: 0.6
  ready_dwell_s: 1.0
  start_lead_s: 0.5
  startup_timeout_s: 150.0
  maximum_run_s: 300.0
  individual_failure: group_land
  separation_mode: stationary_hover
  takeoff_mode: simultaneous
drones:
